<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Delhi High Court Case Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #2c3e50;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #416a89;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      color: #ecf0f1;
      width: 500px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 5px;
    }

    select,
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background-color: #e74c3c;
      color: white;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c0392b;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }

    #results table {
      width: 100%;
      background: #f5f6fa;
      color: #2c3e50;
      margin-top: 20px;
      border-collapse: collapse;
    }

    #results th,
    #results td {
      border: 1px solid #bdc3c7;
      padding: 8px;
      text-align: left;
    }

    #results th {
      background: #d5e8f6;
    }

    #results span {
      display: block;
      margin-top: 18px;
      color: red;
    }
  </style>
</head>

      <label for="case_no">Case Number:</label>
      <input type="text" id="case_no" name="case_no" placeholder="e.g. 123" required>

      <label for="case_year">Filing Year:</label>
      <select id="case_year" name="case_year" required>
        <option value="">Select</option>
      </select>

      <button type="submit">SUBMIT</button>
    </form>
    <div id="results"></div>
    <div class="footer">Thanks To Visit</div>
  </div>

  <script>
    // Populate year dropdown
    const yearDropdown = document.getElementById("case_year");
    for (let y = 2025; y >= 1951; y--) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.text = y;
      yearDropdown.appendChild(opt);
    }

    document.getElementById("caseForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const caseType = document.getElementById("case_type").value;
      const caseNo = document.getElementById("case_no").value;
      const caseYear = document.getElementById("case_year").value;

      document.getElementById("results").innerHTML = "<em>Searching...</em>";

      const resp = await fetch("/scrape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          case_type: caseType,
          case_no: caseNo,
          case_year: caseYear
        })
      });

      const data = await resp.json();
      if (data.error) {
        document.getElementById("results").innerHTML = `<span>${data.error}</span>`;
      } else if (data.rows && data.header) {
        let html = "<table><tr>";
        for (let h of data.header) html += `<th>${h}</th>`;
        html += "</tr>";
        for (let row of data.rows) {
          html += "<tr>";
          for (let col of row) html += `<td>${col}</td>`;
          html += "</tr>";
        }
        html += "</table>";
        document.getElementById("results").innerHTML = html;
      } else {
        document.getElementById("results").innerHTML = "No data found.";
      }
    });
  </script>
</body>

</html>
